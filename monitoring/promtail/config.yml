server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lexdiff-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: lexdiff-api
          __path__: /var/log/lexdiff/*.log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=lex-diff"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
