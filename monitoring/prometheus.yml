global:
  scrape_interval: 15s
  evaluation_interval: 15s

# S6-6: Alert rules for unmatchedRatio
rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: lexdiff-api
    static_configs:
      - targets: ["api:3001"]
    metrics_path: /metrics
